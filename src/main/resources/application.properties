spring.application.name=ressoa-api

# -------------------------------------------------------------------
# Toda configuração sensível vem de variáveis de ambiente (ver .env.example).
# Nenhum segredo fica neste arquivo.
# -------------------------------------------------------------------
server.port=${PORT:8080}

# Banco Oracle (esquema criado por scripts/script-bd.sql)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:ressoa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Colunas TIMESTAMP (sem fuso) do contrato: Instant gravado e lido em UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Segurança (JWT HS256 compartilhado com a API .NET)
ressoa.jwt.secret=${JWT_SECRET:}
ressoa.jwt.issuer=${JWT_ISSUER:ressoa-api}
ressoa.jwt.audience=${JWT_AUDIENCE:ressoa}
ressoa.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:480}
ressoa.cors.origens=${CORS_ORIGENS:*}

# Dados iniciais (usuários de teste e bairros de exemplo, só se o banco estiver vazio)
ressoa.seed.habilitado=${SEED_HABILITADO:true}
ressoa.seed.senha-padrao=${SEED_SENHA_PADRAO:Ressoa@2026}

# IA generativa (Spring AI + Google Gemini). AI_CHAT_PROVIDER=none desliga o LLM
# e a API passa a usar a orientação de contingência (template por nível de risco).
spring.ai.model.chat=${AI_CHAT_PROVIDER:google-genai}
spring.ai.model.embedding.text=none
spring.ai.model.embedding.multimodal=none
spring.ai.model.image=none
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.temperature=0.3

# Mensageria (RabbitMQ / CloudAMQP). Aceita URI amqps://usuario:senha@host/vhost
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3

# Observabilidade
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.rabbit.enabled=${HEALTH_RABBIT:true}

# Documentação
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.default-produces-media-type=application/json
