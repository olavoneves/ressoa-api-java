# Mantém a API pública (Render, plano gratuito) acordada até o fim da correção (30/11).
# O plano gratuito hiberna após 15 min sem tráfego e a JVM leva ~3,5 min para subir com 0,1 CPU.
# Só a API Java é mantida ativa: a .NET acorda em segundos e assim a cota de horas do Render é preservada.
name: Manter API ativa

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Health check da API Java no Render
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 300 \
            https://ressoa-api-java.onrender.com/actuator/health/liveness
