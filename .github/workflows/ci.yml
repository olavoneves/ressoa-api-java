name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build e testes (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build e testes
        run: ./mvnw -B verify
      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-surefire
          path: target/surefire-reports
